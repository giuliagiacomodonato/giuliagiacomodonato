name: Update README with recent activity

on:
  schedule:
    - cron: "0 * * * *"  # corre cada hora
  workflow_dispatch:      # también puede correrse manualmente

permissions:
  contents: write  # necesario para poder actualizar el README

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Update recent activity
        uses: Readme-Workflows/recent-activity@main
        with:
          GH_USERNAME: giuliagiacomodonato
          CONFIG_FILE: .github/recent-activity.config.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 👈 necesario para que la acción tenga permisos


